name: 'Setup Java from gradle.properties'
description: 'Sets up Java using version specified in gradle.properties'
runs:
  using: "composite"
  steps:
    - name: Extract Java version from gradle.properties
      shell: bash
      id: java-version
      run: |
        JAVA_VERSION=$(sed -n 's/^JAVA_RUNTIME_VERSION=//p' gradle.properties)
        if [ -z "$JAVA_VERSION" ]; then
          JAVA_VERSION=$(sed -n 's/^JVM_TOOLCHAIN=//p' gradle.properties)
        fi
        test -n "$JAVA_VERSION"
        echo "version=$JAVA_VERSION" >> $GITHUB_OUTPUT
        echo "Using Java version: $JAVA_VERSION"

    - name: Set up Java
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
      with:
        distribution: 'temurin'
        java-version: ${{ steps.java-version.outputs.version }}

name: Diagnose toolchain and public API access
on:
  workflow_dispatch:
    inputs:
      check_api:
        description: Also check unfunded public API contracts
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Verify the selected JDK
        run: |
          "$JAVA_HOME/bin/java" -version
          grep -Eq '^JAVA_VERSION="25[."]' "$JAVA_HOME/release"
      - name: Probe public API from the hosted runner
        if: inputs.check_api
        run: bash .private/run_tor_ci.sh

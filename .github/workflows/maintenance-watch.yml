name: Watch maintenance discovery
on:
  workflow_call:
    outputs:
      proposal:
        value: ${{ jobs.watch.outputs.proposal }}
      proposal_head:
        value: ${{ jobs.watch.outputs.head }}
      reconciliation_run:
        description: Exact trusted run for an existing public release awaiting verification
        value: ${{ jobs.watch.outputs.reconciliation_run }}
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: maintenance-watch
  cancel-in-progress: true
jobs:
  watch:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      proposal: ${{ steps.classify.outputs.proposal }}
      head: ${{ steps.classify.outputs.proposal_head }}
      reconciliation_run: ${{ steps.classify.outputs.reconciliation_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Classify proposals without executing their code
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .private/maintenance_watch.py

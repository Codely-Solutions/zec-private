name: Build and publish ZEC Private
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
    secrets:
      RELEASE_KEYSTORE_BASE64:
        required: true
      RELEASE_STORE_PASSWORD:
        required: true
      RELEASE_KEY_PASSWORD:
        required: true
      NTFY_URL:
        required: false
permissions: {}
concurrency:
  group: zec-private-release
  cancel-in-progress: false
jobs:
  unsigned:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: identity
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false
      - name: Fork regression checks
        run: |
          python3 .private/check.py
          python3 .private/test_controls.py
      - name: Enforce excluded production integrations
        run: |
          chmod +x gradlew
          ./gradlew -I .private/runtime-inventory.gradle --no-daemon --no-watch-fs --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process :app:privateRuntimeInventory
          python3 .private/check_exclusions.py artifact/runtime.json
      - name: Unfunded NEAR API contracts over Tor without credentials
        timeout-minutes: 15
        run: bash .private/run_tor_ci.sh
      - name: Unit tests including quote text rendering
        timeout-minutes: 20
        env:
          QUOTE_LAYOUT_SCREENSHOTS: ${{ github.workspace }}/ui-lib/build/reports/quote-layout
        run: |
          chmod +x gradlew
          ./gradlew -I .private/robolectric-ci.gradle --no-daemon --no-watch-fs --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process :ui-lib:testZcashmainnetFossReleaseUnitTest
      - name: Upload phone-width layout previews for visual review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quote-layout-previews
          path: ui-lib/build/reports/quote-layout/
          if-no-files-found: error
          retention-days: 2
      - name: Detekt and Android lint
        timeout-minutes: 20
        run: ./gradlew --no-daemon --no-watch-fs --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process detektAll :app:lintZcashmainnetFossRelease
      - name: Assemble and bind unsigned FOSS release
        timeout-minutes: 30
        run: |
          ./gradlew --no-daemon --no-watch-fs --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process :app:assembleZcashmainnetFossRelease
          python3 .private/proof.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-unsigned-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 3
      - name: Retain bounded validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validation-reports
          path: |
            ui-lib/build/test-results/
            ui-lib/build/reports/tests/
            ui-lib/build/reports/quote-layout/
            app/build/reports/lint-results-*.xml
            build/reports/detekt/
            artifact/runtime.json
            artifact/near-contract.json
            artifact/proof.json
          if-no-files-found: ignore
          retention-days: 3
  publish:
    needs: unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-unsigned-apk
          path: artifact/
      - name: Sign, verify, publish and record successful integration
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.unsigned.outputs.source_sha }}
          CONTROLLER_SHA: ${{ github.sha }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gh auth setup-git
          python3 .private/publish.py
      - name: Notify signed APK ready
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_url=$(gh release view --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          release_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          python3 .private/notify.py "ZEC Private $release_tag is ready. APK built and signed. $release_url"
  failed:
    if: ${{ always() && (needs.unsigned.result == 'failure' || needs.publish.result == 'failure') }}
    needs: [unsigned, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          MAKE_ISSUE: 'true'
        run: python3 .private/notify.py "ZEC Private update blocked by a build or release check. Last working release remains available."

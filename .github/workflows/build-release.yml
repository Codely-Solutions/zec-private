name: Donation readiness unit diagnostic
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: donation-readiness-unit-diagnostic
  cancel-in-progress: false
jobs:
  unit-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
      - name: Run preparation and replay regressions only
        run: >-
          ./gradlew --no-daemon --no-watch-fs --no-parallel --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx3g -XX:+ExitOnOutOfMemoryError -XX:-HeapDumpOnOutOfMemoryError'
          -Pkotlin.compiler.execution.strategy=in-process
          -I .private/robolectric-ci.gradle :ui-lib:testZcashmainnetFossReleaseUnitTest
          --tests '*AutoDonationCoordinatorTest' --tests '*AutoDonationStoreTest'
      - name: Collect at most 1 MiB of XML and exact source identity
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          output=Path('diagnostic-reports');output.mkdir()
          files=list(Path('ui-lib/build/test-results/testZcashmainnetFossReleaseUnitTest').glob('TEST-*AutoDonation*Test.xml'))
          total=sum(p.stat().st_size for p in files)
          if total > 1048400:raise RuntimeError('Diagnostic XML budget exceeded')
          for path in files:(output/path.name).write_bytes(path.read_bytes())
          (output/'source-sha.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: donation-readiness-unit-reports
          path: diagnostic-reports/
          retention-days: 1
          if-no-files-found: error

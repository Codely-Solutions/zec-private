name: Build and publish ZEC Private
on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: Build and validate a candidate without signing or publishing
        type: boolean
        default: false
      build_emulator:
        description: Include the isolated x86_64 debug APK once for UI acceptance
        type: boolean
        default: false
      candidate_run:
        description: Promote a successful validation run without rebuilding
        type: string
        default: ''
      reconciliation_run:
        description: Verify and record an already published release from its original signing run
        type: string
        default: ''
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ''
      reconciliation_run:
        type: string
        default: ''
      preflight_only:
        type: boolean
        default: false
      hosted:
        type: boolean
        default: false
      recover_run:
        type: string
        default: ''
      quote_run:
        type: string
        default: ''
      preclaim_run:
        type: string
        default: ''
    secrets:
      NTFY_URL:
        required: false
      RELEASE_KEYSTORE_BASE64:
        required: true
      RELEASE_STORE_PASSWORD:
        required: true
      RELEASE_KEY_PASSWORD:
        required: true
      MAINTENANCE_APP_PRIVATE_KEY:
        required: true
permissions: {}
concurrency:
  group: zec-private-release
  cancel-in-progress: false
jobs:
  admit_hosted:
    if: inputs.hosted && !inputs.reconciliation_run && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      original_controller: ${{ steps.admission.outputs.original_controller }}
      production_id: ${{ steps.admission.outputs.production_id }}
      core_id: ${{ steps.admission.outputs.core_id }}
      quote_id: ${{ steps.admission.outputs.quote_id }}
      core_receipt_id: ${{ steps.admission.outputs.core_receipt_id }}
      quote_receipt_id: ${{ steps.admission.outputs.quote_receipt_id }}
      quote_receipt_run: ${{ steps.admission.outputs.quote_run }}
      run_missing_core: ${{ steps.admission.outputs.run_missing_core }}
      previous_reservation: ${{ steps.admission.outputs.previous_reservation }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RECOVER_RUN: ${{ inputs.recover_run }}
          QUOTE_RUN: ${{ inputs.quote_run }}
          PRECLAIM_RUN: ${{ inputs.preclaim_run }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$SOURCE_SHA"
          PYTHONPATH=.private python3 -B - <<'PY'
          import os
          from hosted_release import admit
          from release_metadata import Metadata
          source, controller = os.environ['SOURCE_SHA'], os.environ['GITHUB_SHA']
          if os.environ['RECOVER_RUN']:
              if os.environ['PREFLIGHT_ONLY'] == 'true':
                  raise ValueError('Preflight cannot authorize recovery')
              from acceptance_policy import ROOT
              from quote_recovery import resolve
              result = resolve(ROOT, source, controller, os.environ['RECOVER_RUN'], Metadata(), os.environ['QUOTE_RUN'],
                               preclaim_run=os.environ['PRECLAIM_RUN'])
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.writelines(f'{key}={value}\n' for key, value in result.items())
          else:
              admit(source, controller, Metadata(), preflight_only=os.environ['PREFLIGHT_ONLY'] == 'true')
          PY
  preflight:
    needs: admit_hosted
    if: ${{ always() && !cancelled() && !inputs.reconciliation_run && (!inputs.hosted || needs.admit_hosted.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      signing_changed: ${{ steps.wiring.outputs.changed }}
    steps:
      - name: Check out the trusted release controller
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select signing smoke from trusted wiring
        if: github.ref == 'refs/heads/main'
        id: wiring
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .private/signing_wiring.py
      - name: Verify signing credentials are absent outside the environment
        if: steps.wiring.outputs.changed == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: test -z "$RELEASE_KEYSTORE_BASE64" && test -z "$RELEASE_STORE_PASSWORD" && test -z "$RELEASE_KEY_PASSWORD"
      - name: Check out the exact new candidate
        if: ${{ !inputs.candidate_run && !inputs.recover_run }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Offline source and controller checks
        if: ${{ !inputs.candidate_run && !inputs.recover_run }}
        run: |
          baseline=$(python3 -c 'import json; print(json.load(open(".private/upgrade-baseline.json"))["source_sha"])')
          python3 -B .private/preflight.py --base "$baseline"
      - name: Fork regression checks
        if: ${{ !inputs.candidate_run && !inputs.recover_run }}
        run: |
          python3 -B .private/test_controls.py
          python3 -B .private/test_packaging.py
          python3 -B .private/test_branding.py
          python3 -B .private/test_foundation.py
          python3 -B .private/test_preflight.py
          python3 -B .private/test_actions_artifact_cleanup.py
          python3 -B .private/test_acceptance_policy.py
          python3 -B .private/test_publish.py
          python3 -B .private/test_maintenance_watch.py
          python3 -B .private/test_core_faucet.py
          python3 -B .private/test_hosted_release.py
          python3 -B .private/test_quote_recovery.py
          python3 -B .private/test_custom_release.py
          python3 -B .private/test_maintenance_cadence.py
          python3 -B .private/test_sync.py
          python3 -B .private/test_release_notes.py
          python3 -B .private/test_toolchain_policy.py
          python3 -B .private/test_fixture_download.py
          python3 -B .private/test_core_instrumentation_pairing.py
          python3 -B .private/test_dev_session.py
          python3 -B .private/test_prepared_apks.py
          python3 -B .private/test_ui_capture.py
          PYTHONPATH=.private python3 -B -m unittest test_emulator_session test_emulator_batch
      - name: Select acceptance by exact relevant inputs before expensive preparation
        env:
          VALIDATION_ONLY: ${{ inputs.hosted || inputs.validation_only || false }}
        if: ${{ !inputs.candidate_run && !inputs.recover_run }}
        run: python3 -B .private/acceptance_status.py
      - if: ${{ !inputs.candidate_run && !inputs.recover_run }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - if: ${{ !inputs.candidate_run && !inputs.recover_run }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
      - name: Strict Linux configuration and release Detekt
        if: ${{ !inputs.candidate_run && !inputs.recover_run }}
        run: |
          chmod +x gradlew
          ./gradlew -I .private/release-analysis.gradle --dependency-verification strict --warning-mode all \
            --no-daemon --no-watch-fs --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g' \
            -Pkotlin.compiler.execution.strategy=in-process help detektAll
  signing_smoke:
    needs: preflight
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.signing_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    environment: production-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify protected certificate and private-key access
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: bash .private/verify_signing_key.sh
  unsigned:
    needs: [preflight, signing_smoke]
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && (needs.signing_smoke.result == 'success' || (needs.signing_smoke.result == 'skipped' && needs.preflight.outputs.signing_changed != 'true')) && !inputs.candidate_run && !inputs.recover_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.sha }}
      artifact_id: ${{ steps.apk.outputs.artifact-id }}
    steps:
      - name: Record APK job admission in preflight mode
        if: inputs.preflight_only
        run: echo 'Shared preflight admitted this APK job.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.preflight_only }}
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: identity
        if: ${{ !inputs.preflight_only }}
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: ${{ !inputs.preflight_only }}
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: ${{ !inputs.preflight_only }}
        with:
          cache-read-only: ${{ inputs.hosted || false }}
      - name: Unfunded NEAR API contracts over Tor without credentials
        if: ${{ !inputs.preflight_only }}
        timeout-minutes: 15
        run: bash .private/run_tor_ci.sh
      - name: Validate and assemble production candidate once
        if: ${{ !inputs.preflight_only }}
        timeout-minutes: 40
        env:
          QUOTE_LAYOUT_SCREENSHOTS: ${{ github.workspace }}/ui-lib/build/reports/quote-layout
        run: bash .private/release_checks.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.preflight_only }}
        id: apk
        with:
          name: validated-unsigned-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 3
      - name: Retain bounded validation reports
        if: ${{ always() && !inputs.preflight_only && !inputs.hosted }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validation-reports
          path: |
            build/reports/profile/
            feature-ledger/build/test-results/
            wallet-foundation-lib/build/test-results/
            ui-design-lib/build/test-results/testReleaseUnitTest/TEST-*.xml
            ui-lib/build/test-results/
            ui-lib/build/reports/tests/
            ui-lib/build/reports/quote-layout/
            app/build/reports/lint-results-*.xml
            artifact/runtime.json
            artifact/foundation-runtime.json
            artifact/near-contract.json
            artifact/gradle-timing.json
            artifact/task-timing.jsonl
            artifact/proof.json
            artifact/core-acceptance.json
            artifact/quote-acceptance.json
          if-no-files-found: ignore
          retention-days: 3
  emulator:
    needs: [preflight, signing_smoke]
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && (needs.signing_smoke.result == 'success' || (needs.signing_smoke.result == 'skipped' && needs.preflight.outputs.signing_changed != 'true')) && !inputs.candidate_run && !inputs.recover_run && (inputs.build_emulator || inputs.hosted) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.apk.outputs.artifact-id }}
    steps:
      - name: Record APK job admission in preflight mode
        if: inputs.preflight_only
        run: echo 'Shared preflight admitted this APK job.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ !inputs.preflight_only }}
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        if: ${{ !inputs.preflight_only }}
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        if: ${{ !inputs.preflight_only }}
        with:
          cache-read-only: true
      - name: Assemble isolated emulator candidate once
        if: ${{ !inputs.preflight_only }}
        timeout-minutes: 40
        run: bash .private/emulator_checks.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !inputs.preflight_only }}
        id: apk
        with:
          name: isolated-ui-repro-apk
          path: emulator-artifact/
          if-no-files-found: error
          retention-days: 3
      - name: Retain bounded emulator timing
        if: ${{ always() && !inputs.preflight_only && !inputs.hosted }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: emulator-validation-reports
          path: |
            artifact/task-timing.jsonl
            build/reports/profile/
          if-no-files-found: ignore
          retention-days: 3
  testnet_apk:
    needs: [preflight, signing_smoke]
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && (needs.signing_smoke.result == 'success' || (needs.signing_smoke.result == 'skipped' && needs.preflight.outputs.signing_changed != 'true')) && inputs.hosted && !inputs.recover_run && !inputs.candidate_run }}
    permissions:
      contents: read
    uses: ./.github/workflows/core-validation.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      preflight_only: ${{ inputs.preflight_only }}
  hosted_core:
    needs: [admit_hosted, preflight, signing_smoke, unsigned, testnet_apk, recovery_quotes]
    if: ${{ !cancelled() && inputs.hosted && !inputs.preflight_only && needs.admit_hosted.result == 'success' && needs.preflight.result == 'success' && (needs.signing_smoke.result == 'success' || (needs.signing_smoke.result == 'skipped' && needs.preflight.outputs.signing_changed != 'true')) && ((!inputs.recover_run && needs.unsigned.result == 'success' && needs.testnet_apk.result == 'success') || (inputs.recover_run && needs.admit_hosted.outputs.run_missing_core == 'true' && (!inputs.preclaim_run || needs.recovery_quotes.result == 'success'))) }}
    permissions:
      actions: read
      contents: write
      packages: read
    uses: ./.github/workflows/hosted-core.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      artifact_id: ${{ needs.admit_hosted.outputs.core_id || needs.testnet_apk.outputs.artifact_id }}
      production_id: ${{ needs.admit_hosted.outputs.production_id || needs.unsigned.outputs.artifact_id }}
      original_run: ${{ inputs.recover_run }}
      original_controller: ${{ needs.admit_hosted.outputs.original_controller }}
      previous_reservation: ${{ needs.admit_hosted.outputs.previous_reservation }}
      preclaim_run: ${{ inputs.preclaim_run }}
  hosted_quotes:
    needs: [admit_hosted, preflight, signing_smoke, unsigned, emulator]
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && (needs.signing_smoke.result == 'success' || (needs.signing_smoke.result == 'skipped' && needs.preflight.outputs.signing_changed != 'true')) && inputs.hosted && !inputs.preflight_only && !inputs.preclaim_run && needs.admit_hosted.outputs.quote_receipt_id == '' && needs.admit_hosted.result == 'success' && (inputs.recover_run || (needs.unsigned.result == 'success' && needs.emulator.result == 'success')) }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/hosted-acceptance-probe.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      quote_id: ${{ needs.admit_hosted.outputs.quote_id || needs.emulator.outputs.artifact_id }}
      production_id: ${{ needs.admit_hosted.outputs.production_id || needs.unsigned.outputs.artifact_id }}
      original_run: ${{ inputs.recover_run }}
      original_controller: ${{ needs.admit_hosted.outputs.original_controller }}
  recovery_quotes:
    needs: [admit_hosted, preflight, signing_smoke]
    if: ${{ !cancelled() && inputs.preclaim_run && needs.admit_hosted.outputs.previous_reservation != '' && needs.admit_hosted.result == 'success' && needs.preflight.result == 'success' && (needs.signing_smoke.result == 'success' || (needs.signing_smoke.result == 'skipped' && needs.preflight.outputs.signing_changed != 'true')) }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/hosted-acceptance-probe.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      quote_id: ${{ needs.admit_hosted.outputs.quote_id }}
      production_id: ${{ needs.admit_hosted.outputs.production_id }}
      original_run: ${{ inputs.recover_run }}
      original_controller: ${{ needs.admit_hosted.outputs.original_controller }}
  promotion:
    needs: [preflight, signing_smoke]
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && (needs.signing_smoke.result == 'success' || (needs.signing_smoke.result == 'skipped' && needs.preflight.outputs.signing_changed != 'true')) && !inputs.preflight_only && github.ref == 'refs/heads/main' && inputs.candidate_run && !inputs.reconciliation_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: python3 .private/promotion.py
  publish:
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && (needs.signing_smoke.result == 'success' || (needs.signing_smoke.result == 'skipped' && needs.preflight.outputs.signing_changed != 'true')) && !inputs.preflight_only && github.ref == 'refs/heads/main' && vars.PRODUCTION_SIGNING_READY == 'true' && !inputs.validation_only && !inputs.reconciliation_run && ((inputs.hosted && (needs.hosted_quotes.result == 'success' || needs.recovery_quotes.result == 'success' || needs.admit_hosted.outputs.quote_receipt_id != '') && (needs.hosted_core.result == 'success' || needs.admit_hosted.outputs.core_receipt_id != '')) || (!inputs.hosted && (needs.promotion.result == 'success' || (needs.unsigned.result == 'success' && (!inputs.build_emulator || needs.emulator.result == 'success'))))) }}
    needs: [preflight, signing_smoke, unsigned, emulator, promotion, testnet_apk, hosted_core, hosted_quotes, recovery_quotes, admit_hosted]
    environment: production-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    outputs:
      release_tag: ${{ steps.publication.outputs.release_tag }}
      attestation_digest: ${{ steps.publication.outputs.attestation_digest }}
      attestation_id: ${{ steps.attestation.outputs.artifact-id }}
    steps:
      - name: Checkout trusted controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: '!inputs.hosted'
        with:
          name: validated-unsigned-apk
          path: artifact/
          run-id: ${{ inputs.candidate_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.hosted
        with:
          artifact-ids: ${{ needs.admit_hosted.outputs.production_id || needs.unsigned.outputs.artifact_id }}
          path: artifact/
          run-id: ${{ inputs.recover_run || github.run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.hosted && !inputs.recover_run
        with:
          artifact-ids: ${{ needs.hosted_core.outputs.receipt_id }},${{ needs.hosted_quotes.outputs.receipt_id }}
          path: hosted-receipts/
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.hosted && inputs.recover_run
        with:
          artifact-ids: ${{ needs.admit_hosted.outputs.core_receipt_id || needs.hosted_core.outputs.receipt_id }}
          path: hosted-receipts/
          run-id: ${{ needs.admit_hosted.outputs.core_receipt_id != '' && inputs.recover_run || github.run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.hosted && inputs.recover_run
        with:
          artifact-ids: ${{ needs.admit_hosted.outputs.quote_receipt_id || needs.hosted_quotes.outputs.receipt_id || needs.recovery_quotes.outputs.receipt_id }}
          path: hosted-receipts/
          run-id: ${{ needs.admit_hosted.outputs.quote_receipt_run || github.run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Fetch exact hosted candidate objects without checking out its code
        if: inputs.hosted
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$SOURCE_SHA"
      - name: Sign and verify the validated APK
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.promotion.outputs.source_sha || needs.unsigned.outputs.source_sha || inputs.source_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.recover_run || inputs.candidate_run || github.run_id }}
          RECOVER_RUN: ${{ inputs.recover_run }}
          RECOVER_QUOTE_RUN: ${{ inputs.quote_run }}
          PRECLAIM_RUN: ${{ inputs.preclaim_run }}
          CONTROLLER_SHA: ${{ github.sha }}
          HOSTED_ACCEPTANCE: ${{ inputs.hosted || false }}
          PRODUCTION_ID: ${{ needs.admit_hosted.outputs.production_id || needs.unsigned.outputs.artifact_id }}
          CORE_ID: ${{ needs.admit_hosted.outputs.core_id || needs.testnet_apk.outputs.artifact_id }}
          QUOTE_ID: ${{ needs.admit_hosted.outputs.quote_id || needs.emulator.outputs.artifact_id }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: python3 -B .private/publish.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: attestation
        with:
          name: release-attestation-${{ github.run_attempt }}
          path: dist/release-attestation.json
          if-no-files-found: error
          retention-days: 3
      - name: Publish the signed APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_DIGEST: ${{ steps.publication.outputs.attestation_digest }}
          PUBLISH_SIGNED_RELEASE: 'true'
        run: python3 -B .private/publish.py
  reconcile:
    if: github.ref == 'refs/heads/main' && inputs.reconciliation_run && !inputs.candidate_run && !inputs.build_emulator && !inputs.validation_only && !inputs.preflight_only
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      actions: read
      contents: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      attestation_id: ${{ steps.resolve.outputs.attestation_id }}
      attestation_digest: ${{ steps.resolve.outputs.attestation_digest }}
      controller_sha: ${{ steps.resolve.outputs.controller_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve the original successful publisher and attestation
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILIATION_RUN: ${{ inputs.reconciliation_run }}
        run: python3 -B .private/reconcile_release.py
  verify_publication:
    if: ${{ always() && !cancelled() && (needs.publish.result == 'success' || needs.reconcile.result == 'success') }}
    needs: [publish, reconcile]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/verify-public-release.yml
    with:
      release_tag: ${{ needs.publish.outputs.release_tag || needs.reconcile.outputs.release_tag }}
      attestation_id: ${{ needs.publish.outputs.attestation_id || needs.reconcile.outputs.attestation_id }}
      attestation_digest: ${{ needs.publish.outputs.attestation_digest || needs.reconcile.outputs.attestation_digest }}
      attestation_run: ${{ inputs.reconciliation_run || github.run_id }}
      attestation_controller: ${{ needs.reconcile.outputs.controller_sha || github.sha }}
  record_integration:
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.verify_publication.result == 'success' }}
    needs: [publish, reconcile, verify_publication]
    environment: maintenance-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.publish.outputs.attestation_id || needs.reconcile.outputs.attestation_id }}
          path: ${{ runner.temp }}/publication
          run-id: ${{ inputs.reconciliation_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare the exact integration commit using trusted controller code
        id: integration
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_DIGEST: ${{ needs.publish.outputs.attestation_digest || needs.reconcile.outputs.attestation_digest }}
          ATTESTATION_CONTROLLER: ${{ needs.reconcile.outputs.controller_sha || github.sha }}
        run: python3 -B .private/integrate_release.py
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: integrator
        with:
          client-id: Iv23lik3K6p93iDL148Q
          private-key: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
          owner: Codely-Solutions
          repositories: zec-private
          permission-contents: write
      - name: Fast-forward protected main as the maintenance App
        env:
          GH_TOKEN: ${{ steps.integrator.outputs.token }}
          INTEGRATION_COMMIT: ${{ steps.integration.outputs.commit }}
        run: |
          [[ "$INTEGRATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh auth setup-git
          git push origin "$INTEGRATION_COMMIT:refs/heads/main"
  notify:
    if: ${{ always() && !cancelled() && needs.record_integration.result == 'success' }}
    needs: [publish, reconcile, record_integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Notify independently verified publication
        continue-on-error: true
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag || needs.reconcile.outputs.release_tag }}
        run: python3 .private/notify.py "ZEC Private $RELEASE_TAG is ready. Public download and signing verified. https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
  failed:
    if: ${{ always() && !inputs.preflight_only && github.ref == 'refs/heads/main' && (needs.admit_hosted.result == 'failure' || needs.preflight.result == 'failure' || needs.signing_smoke.result == 'failure' || needs.unsigned.result == 'failure' || needs.emulator.result == 'failure' || needs.emulator.result == 'cancelled' || needs.testnet_apk.result == 'failure' || needs.hosted_core.result == 'failure' || needs.hosted_quotes.result == 'failure' || needs.publish.result == 'failure' || needs.promotion.result == 'failure' || needs.reconcile.result == 'failure' || needs.verify_publication.result == 'failure' || needs.record_integration.result == 'failure') }}
    needs: [admit_hosted, preflight, signing_smoke, unsigned, emulator, testnet_apk, hosted_core, hosted_quotes, recovery_quotes, promotion, publish, reconcile, verify_publication, record_integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          MAKE_ISSUE: 'true'
          PUBLIC_VERIFICATION: ${{ needs.verify_publication.result }}
          INTEGRATION: ${{ needs.record_integration.result }}
          HOSTED_ADMISSION: ${{ needs.admit_hosted.result }}
        run: |
          if [[ "$PUBLIC_VERIFICATION" == failure ]]; then
            python3 .private/notify.py "ZEC Private publication needs reconciliation. Independent public verification failed."
          elif [[ "$INTEGRATION" == failure ]]; then
            python3 .private/notify.py "ZEC Private publication needs reconciliation. The verified release was published, but recording integration failed."
          elif [[ "$HOSTED_ADMISSION" == failure ]]; then
            python3 .private/notify.py "ZEC Private update stopped before building. See the hosted admission check for the blocking prerequisite."
          else
            python3 .private/notify.py "ZEC Private update blocked by a build or release check."
          fi

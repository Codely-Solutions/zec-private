name: Check quote dismissal and retry
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Targeted development checks; release validation still runs the full suite
        type: choice
        options:
          - quotes
          - diagnostics
          - foundation
        default: quotes
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Controlled unfunded quote lifecycle tests
        env:
          TEST_PROFILE: ${{ inputs.profile || 'quotes' }}
        run: |
          if [[ "$TEST_PROFILE" == foundation ]]; then
            python3 -B .private/test_foundation.py
            python3 -B .private/test_sync.py
          fi
          chmod +x gradlew
          tests=(--tests 'co.electriccoin.zcash.ui.common.repository.SwapRepositoryImplTest' --tests 'co.electriccoin.zcash.ui.common.repository.SwapQuoteLifecycleTest' --tests 'co.electriccoin.zcash.ui.common.usecase.CancelSwapQuoteUseCaseTest' --tests 'co.electriccoin.zcash.ui.common.usecase.RequestSwapQuoteUseCaseTest' --tests 'co.electriccoin.zcash.ui.screen.swap.quote.SwapQuoteVMTest')
          if [[ "$TEST_PROFILE" == diagnostics ]]; then
            tests=(--tests 'co.electriccoin.zcash.ui.common.usecase.DiagnosticShareTest')
          fi
          if [[ "$TEST_PROFILE" == foundation ]]; then
            tests=(--tests 'co.electriccoin.zcash.ui.common.model.ZecSwapCompositionTest' --tests 'co.electriccoin.zcash.ui.common.model.near.NearSwapQuoteTest' --tests 'co.electriccoin.zcash.ui.common.repository.SwapRepositoryImplTest' --tests 'co.electriccoin.zcash.ui.common.repository.SwapRecoveryRoutingTest' --tests 'co.electriccoin.zcash.ui.common.repository.ZashiProposalRepositoryTest' --tests 'co.electriccoin.zcash.ui.common.usecase.RequestSwapQuoteUseCaseTest' --tests 'co.electriccoin.zcash.ui.common.usecase.ViewOnlySpendGuardTest' --tests 'co.electriccoin.zcash.ui.screen.swap.quote.SwapQuoteVMTest' --tests 'co.electriccoin.zcash.ui.screen.swap.quote.SwapQuoteVMMapperTest')
          fi
          ./gradlew -I .private/robolectric-ci.gradle -I .private/release-analysis.gradle --continue --no-daemon --no-watch-fs --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process :ui-lib:testZcashmainnetFossReleaseUnitTest "${tests[@]}" :wallet-foundation-lib:test :feature-ledger:testZcashmainnetFossReleaseUnitTest --tests 'co.electriccoin.zcash.ui.common.repository.LedgerProposalRepositoryTest' detektAll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: quote-lifecycle-results
          path: |
            ui-lib/build/test-results/testZcashmainnetFossReleaseUnitTest/*.xml
            wallet-foundation-lib/build/test-results/test/*.xml
            feature-ledger/build/test-results/testZcashmainnetFossReleaseUnitTest/*.xml
            build/reports/detekt/
          if-no-files-found: error
          retention-days: 3

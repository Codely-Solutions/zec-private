name: Check quote dismissal and retry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Controlled unfunded quote lifecycle tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-watch-fs --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process :ui-lib:testZcashmainnetFossReleaseUnitTest --tests 'co.electriccoin.zcash.ui.common.repository.SwapRepositoryImplTest' --tests 'co.electriccoin.zcash.ui.common.usecase.CancelSwapQuoteUseCaseTest' --tests 'co.electriccoin.zcash.ui.common.usecase.RequestSwapQuoteUseCaseTest' --tests 'co.electriccoin.zcash.ui.screen.swap.quote.SwapQuoteVMTest'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: quote-lifecycle-results
          path: ui-lib/build/test-results/testZcashmainnetFossReleaseUnitTest/*.xml
          if-no-files-found: error
          retention-days: 3

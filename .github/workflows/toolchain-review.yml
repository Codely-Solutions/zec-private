name: Check proposed toolchain updates
on:
  pull_request:
    paths:
      - gradle/wrapper/**
      - gradlew
      - gradlew.bat
      - .github/dependabot.yml
      - .github/workflows/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolchain-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Check update policy
        run: python3 -B .private/test_toolchain_policy.py
      - name: Configure the proposed build and expose deprecations
        run: |
          chmod +x gradlew
          ./gradlew help --warning-mode all --no-daemon --no-watch-fs --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process
      - name: State the boundary of this check
        if: always()
        run: |
          echo 'Configuration smoke check only. Refresh fork patch/source-state and run required candidate acceptance before integration or signed publication.' >> "$GITHUB_STEP_SUMMARY"

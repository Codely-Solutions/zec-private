name: Prepare isolated core wallet acceptance
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      preflight_only:
        type: boolean
        default: false
    outputs:
      artifact_id:
        value: ${{ jobs.testnet.outputs.artifact_id }}
  workflow_dispatch:
    inputs:
      build_baseline:
        description: Build pinned prior-release baseline only when its validated artifact is unavailable
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  testnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Record APK job admission in preflight mode
        if: inputs.preflight_only
        run: echo 'Shared preflight admitted this APK job.'
      - if: ${{ !inputs.preflight_only }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Offline preflight before Java and Gradle setup
        if: inputs.source_sha == '' && !inputs.preflight_only
        run: |
          baseline=$(python3 -c 'import json; print(json.load(open(".private/upgrade-baseline.json"))["source_sha"])')
          python3 -B .private/preflight.py --base "$baseline"
      - if: ${{ !inputs.preflight_only }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - if: ${{ !inputs.preflight_only }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: ${{ inputs.source_sha != '' }}
      - name: Build testnet candidate and instrumentation once
        if: ${{ !inputs.preflight_only }}
        run: bash .private/build_core_pair.sh
      - if: ${{ !inputs.preflight_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: core-testnet-candidate
          path: core-artifact/
          retention-days: 3
  baseline:
    if: ${{ inputs.build_baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Read baseline selection from the current controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the pinned prior-release source
        id: selected-baseline
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          sys.path.insert(0, ".private")
          from published_history import source_revision
          baseline = json.load(open(".private/upgrade-baseline.json"))
          source_sha = baseline["source_sha"]
          assert re.fullmatch(r"[0-9a-f]{40}", source_sha), "Invalid baseline source SHA"
          checkout_sha = source_revision(source_sha)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"source_sha={checkout_sha}\n")
          print(f"Selected prior release: {baseline['release']} ({source_sha})")
          PY
      - name: Check out the selected prior release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.selected-baseline.outputs.source_sha }}
          persist-credentials: false
      - name: Read the selected prior release Java runtime
        id: baseline-java
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          properties = Path('gradle.properties').read_text(encoding='utf-8').splitlines()
          pins = [line.removeprefix('JAVA_RUNTIME_VERSION=') for line in properties
                  if line.startswith('JAVA_RUNTIME_VERSION=')]
          if len(pins) != 1 or not re.fullmatch(r'[1-9][0-9]*\.[0-9]+\.[0-9]+\+[0-9]+', pins[0]):
              raise SystemExit('Expected one full JAVA_RUNTIME_VERSION pin in the selected release')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'java_version={pins[0]}', file=output)
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: ${{ steps.baseline-java.outputs.java_version }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
      - name: Build selected prior-release testnet baseline only when needed
        run: |
          chmod +x gradlew
          ./gradlew -I .private/tor-ui-abi.gradle --no-daemon --no-watch-fs --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process :app:assembleZcashtestnetFossDebug
          mkdir -p core-baseline
          cp app/build/outputs/apk/zcashtestnetFoss/debug/*.apk core-baseline/
          git rev-parse HEAD > core-baseline/source-sha.txt
          sha256sum core-baseline/*.apk > core-baseline/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-testnet-baseline
          path: core-baseline/
          retention-days: 30

name: Prepare isolated core wallet acceptance
on:
  workflow_dispatch:
    inputs:
      build_baseline:
        description: Build pinned prior-release baseline only when its validated artifact is unavailable
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  testnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Offline preflight before Java and Gradle setup
        run: |
          baseline=$(python3 -c 'import json; print(json.load(open(".private/upgrade-baseline.json"))["source_sha"])')
          python3 -B .private/preflight.py --base "$baseline"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: false
      - name: Build testnet candidate and instrumentation once
        run: |
          chmod +x gradlew
          ./gradlew -I .private/tor-ui-abi.gradle -I .private/core-wallet/include.gradle --no-daemon --no-watch-fs --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process :app:assembleZcashtestnetFossDebug :app:assembleZcashtestnetFossDebugAndroidTest
      - name: Bind test artifacts
        run: |
          mkdir -p core-artifact
          cp app/build/outputs/apk/zcashtestnetFoss/debug/*.apk core-artifact/
          cp app/build/outputs/apk/androidTest/zcashtestnetFoss/debug/*.apk core-artifact/
          git rev-parse HEAD > core-artifact/source-sha.txt
          sha256sum core-artifact/*.apk > core-artifact/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-testnet-candidate
          path: core-artifact/
          retention-days: 3
  baseline:
    if: ${{ inputs.build_baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 170eb24caaa90969849c3f8dcfcb77f4016196ab
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
      - name: Build exact revision 11 testnet baseline only when needed
        run: |
          chmod +x gradlew
          ./gradlew -I .private/tor-ui-abi.gradle --no-daemon --no-watch-fs --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process :app:assembleZcashtestnetFossDebug
          mkdir -p core-baseline
          cp app/build/outputs/apk/zcashtestnetFoss/debug/*.apk core-baseline/
          git rev-parse HEAD > core-baseline/source-sha.txt
          sha256sum core-baseline/*.apk > core-baseline/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-testnet-baseline
          path: core-baseline/
          retention-days: 30

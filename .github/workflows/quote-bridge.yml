name: Prepare isolated quote bridge
on:
  workflow_call:
    inputs:
      reuse_run_id:
        type: string
        default: ''
    outputs:
      artifact_id:
        value: ${{ jobs.bridge.outputs.artifact_id }}
      artifact_run_id:
        value: ${{ jobs.bridge.outputs.artifact_run_id }}
permissions:
  actions: read
  contents: read
jobs:
  bridge:
    if: github.repository == 'Codely-Solutions/zec-private'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      artifact_id: ${{ steps.retained.outputs.id || steps.upload.outputs.artifact-id }}
      artifact_run_id: ${{ steps.retained.outputs.run_id || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Locate the retained bridge from the admitted controller
        id: retained
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_RUN: ${{ inputs.reuse_run_id }}
          PYTHONPATH: .private
        run: |
          python3 -B - <<'PY'
          import os
          from hosted_quote_probe import retained_bridge
          from release_metadata import Metadata
          run = os.environ['BRIDGE_RUN']
          artifact_id = retained_bridge(run, os.environ['GITHUB_SHA'], Metadata())
          if artifact_id:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write(f'id={artifact_id}\nrun_id={run}\n')
          PY
      - if: steps.retained.outputs.id == ''
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - if: steps.retained.outputs.id == ''
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
      - name: Build the small isolated UI bridge
        if: steps.retained.outputs.id == ''
        timeout-minutes: 6
        run: |
          set -euo pipefail
          chmod +x gradlew
          bridge=(./gradlew -p .private/ui-bridge --no-daemon --no-watch-fs)
          log=$(mktemp)
          trap 'rm -f -- "$log"' EXIT
          if ! "${bridge[@]}" assembleDebug 2>&1 | tee "$log"; then
            # Refresh a negative resolution only when Central serves the exact missing bridge artifacts.
            grep -Fq "Could not resolve all artifacts for configuration 'classpath'." "$log"
            mapfile -t missing < <(sed -nE 's/^ +> Could not find org\.jetbrains\.kotlin:(kotlin-gradle-plugin-api|kotlin-gradle-plugins-bom):([0-9]+\.[0-9]+\.[0-9]+)\.$/\1 \2/p' "$log" | sort -u)
            [[ ${#missing[@]} -ge 1 ]]
            for coordinate in "${missing[@]}"; do
              read -r artifact version <<< "$coordinate"
              curl --fail --silent --show-error --max-time 15 --output /dev/null \
                "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/$artifact/$version/$artifact-$version.pom"
            done
            echo "Maven Central serves the missing Kotlin POMs; refresh bridge dependencies once."
            "${bridge[@]}" --refresh-dependencies assembleDebug
          fi
          mkdir "$RUNNER_TEMP/zec-quote-bridge"
          cp .private/ui-bridge/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/zec-quote-bridge/ui-bridge.apk"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/zec-quote-bridge/source-sha.txt"
      - id: upload
        if: steps.retained.outputs.id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: isolated-quote-bridge
          path: ${{ runner.temp }}/zec-quote-bridge/
          if-no-files-found: error
          retention-days: 3
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/zec-quote-bridge"

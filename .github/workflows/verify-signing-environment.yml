name: Verify production signing environment
on:
  workflow_dispatch:
    inputs:
      require_environment_only:
        description: Verify that repository-scoped signing credentials are absent
        type: boolean
        default: true
permissions: {}
jobs:
  verify-key:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: zec-private-release
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck controller before opening the signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=.private python3 -B -c 'import os; from publish import require_current_controller; require_current_controller(os.environ["GITHUB_SHA"])'
      - name: Verify certificate and private key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: bash .private/verify_signing_key.sh
  verify-scope:
    if: github.ref == 'refs/heads/main' && inputs.require_environment_only
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify an ordinary job receives no signing credentials
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: test -z "$KEYSTORE" && test -z "$STORE_PASSWORD" && test -z "$KEY_PASSWORD"

name: Test update controls without publication
on:
  workflow_dispatch:
    inputs:
      verify_existing_release:
        description: Reverify this already published latest tag with read-only access
        type: string
        default: ''
permissions:
  actions: read
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fee and authentication regression simulations
        if: github.ref == 'refs/heads/main'
        run: python3 .private/test_controls.py
      - name: Product branding and compatibility exceptions
        if: github.ref == 'refs/heads/main'
        run: python3 -B .private/test_branding.py
      - name: Simulated stable update and incompatible-change checks
        if: github.ref == 'refs/heads/main'
        run: python3 .private/test_sync.py
      - name: Test push delivery acceptance
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: python3 .private/notify.py "ZEC Private automation test passed. This is a test notification; no APK was published."
      - name: Run offline release-controller suites
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p ../work
          PYTHONPATH=.private python3 -B -m unittest -v \
            test_quote_recovery test_hosted_release test_publish test_maintenance_watch \
            test_maintenance_cadence test_packaging test_sync test_custom_release test_funded_reuse \
            test_dev_session test_notify test_release_preparation test_core_faucet test_core_instrumentation_pairing \
            test_swap_price_catalog
      - name: Reverify an existing public release without signing or publication
        if: github.ref != 'refs/heads/main' && inputs.verify_existing_release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RELEASE_TAG: ${{ inputs.verify_existing_release }}
        run: python3 -B .private/verify_public_release.py | tee -a "$GITHUB_STEP_SUMMARY"

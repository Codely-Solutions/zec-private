name: Probe isolated Linux Android host
on:
  workflow_dispatch:
    inputs:
      prerequisites:
        description: Check public faucet status before a candidate build
        type: boolean
        default: false
      install_baseline:
        description: Verify the private fixture and install its exact APK pair without a wallet
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hosted-acceptance-probe
  cancel-in-progress: false
jobs:
  blank-guest:
    if: github.ref == 'refs/heads/main' && !inputs.prerequisites && !inputs.install_baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify KVM, isolated boot and owned teardown
        run: bash .private/hosted_emulator_smoke.sh
  faucet-status:
    if: github.ref == 'refs/heads/main' && inputs.prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Verify unfunded faucet prerequisites through an owned Tor instance
        env:
          PYTHONPATH: .private
        run: |
          bash .private/run_tor_ci.sh --install-only
          python3 -B - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from core_faucet import node_executable, readiness
          node_executable()
          with TemporaryDirectory() as root:
              receipt = readiness(Path(root))
              print(f"Testnet faucet healthy through Tor. Claims issued: {receipt['claim_requests']}.")
          PY
  installed-pair:
    if: github.ref == 'refs/heads/main' && inputs.install_baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: '1.3.6'
      - name: Read and verify the selected private pair
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/zec-hosted-pair"
          mkdir -m 700 "$fixture"
          trap 'rm -f -- "$fixture/auth.json"' EXIT
          selected=.private/hosted-fixture.json
          tag=$(jq -er .release "$selected")
          [[ "$tag" == "$(jq -er .release .private/upgrade-baseline.json)" ]]
          reference=$(jq -er .reference "$selected")
          [[ "$reference" =~ ^ghcr\.io/codely-solutions/zec-private-upgrade-fixtures@sha256:[0-9a-f]{64}$ ]]
          export ARCHIVE_DIGEST=$(jq -er .digest "$selected")
          export OCI_DIGEST=${reference##*@}
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin --registry-config "$fixture/auth.json"
          unset REGISTRY_TOKEN
          oras pull --registry-config "$fixture/auth.json" --output "$fixture" "$reference"
          python3 -B .private/hosted_fixture.py verify --tag "$tag" --directory "$fixture" --extract
          diff <(jq -S . "$selected") <(jq -S . "$fixture/fixture-binding.json")
      - name: Install the verified app and instrumentation in an isolated guest
        run: |
          if [[ ! -x "$ANDROID_HOME/build-tools/36.0.0/zipalign" ]]; then
            timeout 180 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0'
          fi
          ZEC_HOSTED_FIXTURE_DIR="$RUNNER_TEMP/zec-hosted-pair" bash .private/hosted_emulator_smoke.sh
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/zec-hosted-pair"

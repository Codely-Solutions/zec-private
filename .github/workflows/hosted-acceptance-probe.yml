name: Probe isolated Linux Android host
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      quote_id:
        type: string
        required: true
      production_id:
        type: string
        required: true
    outputs:
      receipt_id:
        value: ${{ jobs.quote-cycles.outputs.receipt_id }}
  workflow_dispatch:
    inputs:
      prerequisites:
        description: Check public faucet status before a candidate build
        type: boolean
        default: false
      install_baseline:
        description: Verify the private fixture and install its exact APK pair without a wallet
        type: boolean
        default: false
      test_transport:
        description: Run the unfunded native Tor interruption and recovery check on the verified pair
        type: boolean
        default: false
      cold_start_diagnostics:
        description: Observe two additional isolated app starts under the existing firewall
        type: boolean
        default: false
      quote_release:
        description: Exercise real unfunded quotes using the existing accepted APK for this release tag
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: hosted-acceptance-probe
  cancel-in-progress: false
jobs:
  blank-guest:
    if: github.ref == 'refs/heads/main' && !inputs.source_sha && !inputs.prerequisites && !inputs.install_baseline && !inputs.test_transport && !inputs.quote_release
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify KVM, isolated boot and owned teardown
        run: bash .private/hosted_emulator_smoke.sh
  faucet-status:
    if: github.ref == 'refs/heads/main' && inputs.prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Verify unfunded faucet prerequisites through an owned Tor instance
        env:
          PYTHONPATH: .private
        run: |
          bash .private/run_tor_ci.sh --install-only
          python3 -B - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from core_faucet import node_executable, readiness
          node_executable()
          with TemporaryDirectory() as root:
              receipt = readiness(Path(root))
              print(f"Testnet faucet healthy through Tor. Claims issued: {receipt['claim_requests']}.")
          PY
  installed-pair:
    if: github.ref == 'refs/heads/main' && (inputs.install_baseline || inputs.test_transport)
    runs-on: ubuntu-24.04
    timeout-minutes: 21
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: '1.3.6'
      - name: Read and verify the selected private pair
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: bash .private/pull_hosted_fixture.sh "$RUNNER_TEMP/zec-hosted-pair"
      - name: Execute the selected verification in an isolated guest
        env:
          ZEC_HOSTED_TRANSPORT_PROBE: ${{ inputs.test_transport }}
          ZEC_REPEAT_COLD_START: ${{ inputs.cold_start_diagnostics }}
        run: |
          if [[ ! -x "$ANDROID_HOME/build-tools/36.0.0/zipalign" ]]; then
            timeout 180 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0'
          fi
          ZEC_HOSTED_FIXTURE_DIR="$RUNNER_TEMP/zec-hosted-pair" bash .private/hosted_emulator_smoke.sh
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/zec-hosted-pair"
  quote-cycles:
    if: github.ref == 'refs/heads/main' && (inputs.quote_release != '' || inputs.source_sha != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    outputs:
      receipt_id: ${{ steps.receipt.outputs.artifact-id }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the exact executed emulator quote APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.quote_release }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          QUOTE_ID: ${{ inputs.quote_id }}
          PRODUCTION_ID: ${{ inputs.production_id }}
          PYTHONPATH: .private
        run: |
          if [[ -n "$SOURCE_SHA" ]]; then
            [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
            git fetch --no-tags origin "$SOURCE_SHA"
          fi
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          from hosted_quote_probe import stage_candidate, stage_quote_apk
          target = Path(os.environ['RUNNER_TEMP'])/'zec-hosted-quotes'
          source = os.environ['SOURCE_SHA']
          if source:
              stage_candidate(target, source, os.environ['QUOTE_ID'], os.environ['PRODUCTION_ID'])
          else:
              target.mkdir(mode=0o700)
              stage_quote_apk(target, os.environ['RELEASE_TAG'])
          PY
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
      - name: Build the small isolated UI bridge
        timeout-minutes: 6
        run: |
          chmod +x gradlew
          ./gradlew -p .private/ui-bridge --no-daemon --no-watch-fs assembleDebug
          cp .private/ui-bridge/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/zec-hosted-quotes/ui-bridge.apk"
      - name: Exercise unfunded production quotes over app Tor
        run: |
          if [[ ! -x "$ANDROID_HOME/build-tools/36.0.0/zipalign" ]]; then
            timeout 180 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0'
          fi
          ZEC_HOSTED_QUOTE_DIR="$RUNNER_TEMP/zec-hosted-quotes" bash .private/hosted_emulator_smoke.sh
      - id: receipt
        if: inputs.source_sha != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hosted-quote-receipt
          path: ${{ runner.temp }}/zec-hosted-quotes/hosted-quotes.json
          if-no-files-found: error
          retention-days: 3
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/zec-hosted-quotes"

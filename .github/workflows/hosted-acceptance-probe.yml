name: Probe isolated Linux Android host
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-acceptance-probe
  cancel-in-progress: false
jobs:
  blank-guest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify KVM, isolated boot and owned teardown
        run: bash .private/hosted_emulator_smoke.sh

name: Hosted custom release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed custom candidate commit
        type: string
        required: true
      operation:
        description: Check admission, run release preflight, or authorize publication after acceptance
        type: choice
        options: [check, preflight, publish, recover]
        default: check
      recover_run:
        description: Original hosted run ID for quote-only recovery
        type: string
        default: ''
      quote_run:
        description: Passing quote recovery run if its signer failed before publication
        type: string
        default: ''
permissions: {}
jobs:
  review:
    if: github.repository == 'Codely-Solutions/zec-private' && github.ref == 'refs/heads/main' && inputs.operation == 'check'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$SOURCE_SHA"
          PYTHONPATH=.private python3 -B - <<'PY'
          import os
          from acceptance_policy import ROOT
          from custom_release import require_dispatch, verify_custom_child
          from release_changelog import custom_changes
          from release_metadata import Metadata

          source, controller = os.environ['SOURCE_SHA'], os.environ['GITHUB_SHA']
          require_dispatch(source, controller, Metadata(), publish=False)
          verify_custom_child(source, controller, ROOT)
          custom_changes(ROOT, source, controller, required=True)
          print('Exact custom candidate and dispatch verified.')
          PY
  build:
    if: github.repository == 'Codely-Solutions/zec-private' && github.ref == 'refs/heads/main' && (inputs.operation == 'preflight' || ((inputs.operation == 'publish' || inputs.operation == 'recover') && vars.PRODUCTION_SIGNING_READY == 'true'))
    permissions:
      actions: read
      contents: write
      issues: write
      packages: read
    uses: ./.github/workflows/build-release.yml
    with:
      hosted: true
      preflight_only: ${{ inputs.operation == 'preflight' }}
      source_sha: ${{ inputs.source_sha }}
      recover_run: ${{ inputs.recover_run }}
      quote_run: ${{ inputs.quote_run }}
    secrets:
      NTFY_URL: ${{ secrets.NTFY_URL }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      MAINTENANCE_APP_PRIVATE_KEY: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}

name: Preserve accepted testnet pair privately
on:
  push:
    branches: [main]
    paths: ['.private/release-evidence/v*-private.*.json']
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Independently verified release with recorded testnet execution
        required: true
        type: string
      recovery_oci:
        description: Immutable OCI manifest digest for an already uploaded fixture
        type: string
permissions: {}
jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      main: ${{ steps.ref.outputs.main }}
    steps:
      - id: ref
        shell: python
        run: |
          import os

          if (os.environ["GITHUB_REF"] == "refs/heads/main"
              and os.environ["GITHUB_REPOSITORY"] == "Codely-Solutions/zec-private"):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("main=true\n")
  run_main:
    needs: admit
    if: needs.admit.outputs.main == 'true'
    concurrency:
      group: preserve-hosted-fixture
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/preserve-hosted-fixture-main.yml
    with:
      release_tag: ${{ inputs.release_tag || '' }}
      recovery_oci: ${{ inputs.recovery_oci || '' }}

name: Preserve accepted testnet pair privately
on:
  push:
    branches: [main]
    paths: ['.private/release-evidence/v*-private.*.json']
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Independently verified release with recorded testnet execution
        required: true
        type: string
permissions: {}
concurrency:
  group: preserve-hosted-fixture
  cancel-in-progress: false
env:
  FIXTURE_REGISTRY: ghcr.io/codely-solutions/zec-private-upgrade-fixtures
jobs:
  select:
    if: github.ref == 'refs/heads/main' && github.repository == 'Codely-Solutions/zec-private'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_MAIN: ${{ github.event.before }}
        run: python3 -B .private/hosted_fixture.py select --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  store:
    needs: select
    if: needs.select.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      archive_digest: ${{ steps.prepare.outputs.archive_digest }}
      oci_digest: ${{ steps.store.outputs.oci_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/zec-fixture"
          python3 -B .private/hosted_fixture.py prepare --tag "$RELEASE_TAG" --directory "$RUNNER_TEMP/zec-fixture" >> "$GITHUB_OUTPUT"
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: '1.3.6'
      - id: store
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          ARCHIVE_DIGEST: ${{ steps.prepare.outputs.archive_digest }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          GH_TOKEN="$REGISTRY_TOKEN" gh api "orgs/$GITHUB_REPOSITORY_OWNER/packages/container/zec-private-upgrade-fixtures" \
            --jq '.visibility' | grep -Fx private
          cd "$RUNNER_TEMP/zec-fixture"
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin --registry-config auth.json
          unset REGISTRY_TOKEN
          reference="$FIXTURE_REGISTRY:bytes-${ARCHIVE_DIGEST#sha256:}"
          if ! digest=$(oras resolve --registry-config auth.json "$reference"); then
            digest=$(oras push --registry-config auth.json \
              --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              "$reference" fixture.zip:application/zip --format go-template='{{.digest}}')
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "oci_digest=$digest" >> "$GITHUB_OUTPUT"
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/zec-fixture"
  verify:
    needs: [select, store]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      packages: read
    outputs:
      binding: ${{ steps.verify.outputs.binding }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: '1.3.6'
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
          ARCHIVE_DIGEST: ${{ needs.store.outputs.archive_digest }}
          OCI_DIGEST: ${{ needs.store.outputs.oci_digest }}
        run: |
          set -euo pipefail
          gh api "orgs/$GITHUB_REPOSITORY_OWNER/packages/container/zec-private-upgrade-fixtures" \
            --jq '.visibility' | grep -Fx private
          [[ "$OCI_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -m 700 "$RUNNER_TEMP/zec-fixture"
          cd "$RUNNER_TEMP/zec-fixture"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin --registry-config auth.json
          unset GH_TOKEN
          oras pull --registry-config auth.json "$FIXTURE_REGISTRY@$OCI_DIGEST"
          binding=$(python3 -B "$GITHUB_WORKSPACE/.private/hosted_fixture.py" verify --tag "$RELEASE_TAG" --directory "$PWD")
          printf '%s\n' "$binding" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'binding=%s\n' "$binding" >> "$GITHUB_OUTPUT"
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/zec-fixture"
  record:
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment: maintenance-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: record
        env:
          FIXTURE_BINDING: ${{ needs.verify.outputs.binding }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B .private/hosted_fixture.py record >> "$GITHUB_OUTPUT"
          if git diff --quiet -- .private/hosted-fixture.json; then
            echo 'Exact hosted fixture already recorded.'
            exit 0
          fi
          test "$(git diff --name-only)" = '.private/hosted-fixture.json'
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        if: steps.record.outputs.updated == 'true'
        id: integrator
        with:
          client-id: Iv23lik3K6p93iDL148Q
          private-key: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
          owner: Codely-Solutions
          repositories: zec-private
          permission-contents: write
      - name: Record only the verified fixture on the expected main commit
        if: steps.record.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ steps.integrator.outputs.token }}
        run: |
          set -euo pipefail
          jq -n --arg head "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
            --arg content "$(base64 -w0 .private/hosted-fixture.json)" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                expectedHeadOid: $head,
                message: {headline: "Select independently verified hosted upgrade fixture"},
                fileChanges: {additions: [{path: ".private/hosted-fixture.json", contents: $content}]}
              }}
            }' | gh api graphql --input - | jq -er '.data.createCommitOnBranch.commit.oid | strings | select(test("^[a-f0-9]{40}$"))'

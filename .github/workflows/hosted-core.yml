name: Hosted testnet lifecycle
on:
  workflow_dispatch:
    inputs:
      upgrade_probe:
        description: Run the funded lifecycle or isolate one unfunded boundary after an upgrade
        type: choice
        options: [funded, restore, transport]
        default: funded
      rehearsal_number:
        description: Test-only reservation number. Use a later one only after diagnosing prior failed rehearsals.
        type: number
        default: 1
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      artifact_id:
        type: string
        required: true
      production_id:
        type: string
        required: true
      original_run:
        type: string
        default: ''
      original_controller:
        type: string
        default: ''
      previous_reservation:
        type: string
        default: ''
      preclaim_run:
        type: string
        default: ''
      use_tor:
        type: boolean
        default: true
      reuse_funded:
        type: boolean
        default: false
      prepared_id:
        type: string
        default: ''
    outputs:
      receipt_id:
        value: ${{ jobs.wallet.outputs.receipt_id }}
      upgrade_receipt_id:
        value: ${{ jobs.wallet.outputs.upgrade_receipt_id }}
      direct_core_id:
        value: ${{ (inputs.reuse_funded && inputs.prepared_id) || jobs.prepare-direct.outputs.artifact_id }}
permissions: {}
jobs:
  prepare-direct:
    if: github.repository == 'Codely-Solutions/zec-private' && github.ref == 'refs/heads/main' && inputs.source_sha != '' && !inputs.use_tor && (!inputs.reuse_funded || inputs.prepared_id == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63
        with:
          version: '1.3.6'
      - name: Retrieve the exact baseline app and instrumentation
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: bash .private/pull_hosted_fixture.sh "$RUNNER_TEMP/zec-hosted-pair"
      - name: Reuse both app APKs and prepare direct-mode instrumentation
        env:
          GH_TOKEN: ${{ github.token }}
          ZEC_CORE_SOURCE: ${{ inputs.source_sha }}
          ORIGINAL_CORE_ID: ${{ inputs.artifact_id }}
          ORIGINAL_ARTIFACT_RUN: ${{ inputs.original_run }}
          ORIGINAL_BUILD_CONTROLLER: ${{ inputs.original_controller }}
        run: |
          [[ "$ZEC_CORE_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "$ZEC_CORE_SOURCE"
          python3 -B .private/prepare_direct_core.py
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-direct-candidate
          path: direct-core-artifact/
          if-no-files-found: error
          retention-days: 3
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/zec-hosted-pair" "$RUNNER_TEMP/zec-direct-build" direct-core-artifact
  provision-tor:
    if: github.repository == 'Codely-Solutions/zec-private' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.reuse_funded && (!inputs.upgrade_probe || inputs.upgrade_probe == 'funded')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bundle_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash .private/run_tor_ci.sh --prepare-bundle
      - id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hosted-testnet-tor-packages
          path: ${{ runner.temp }}/zec-tor-runtime/
          retention-days: 1
          if-no-files-found: error
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/zec-tor-runtime"
  reserve:
    needs: [provision-tor, prepare-direct]
    if: ${{ !cancelled() && !inputs.reuse_funded && needs.provision-tor.result == 'success' && (inputs.source_sha == '' || inputs.use_tor || needs.prepare-direct.result == 'success') && github.repository == 'Codely-Solutions/zec-private' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (!inputs.upgrade_probe || inputs.upgrade_probe == 'funded') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      reservation: ${{ steps.claim.outputs.reservation }}
      version: ${{ steps.claim.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ORIGINAL_BUILD_CONTROLLER: ${{ inputs.original_controller }}
          ORIGINAL_ARTIFACT_RUN: ${{ inputs.original_run }}
          PREVIOUS_RESERVATION: ${{ inputs.previous_reservation }}
          PRECLAIM_RUN: ${{ inputs.preclaim_run }}
          REHEARSAL: ${{ inputs.source_sha == '' }}
          REHEARSAL_NUMBER: ${{ inputs.rehearsal_number || 1 }}
        run: |
          if [[ -n "$SOURCE_SHA" ]]; then
            [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
            git fetch --no-tags origin "$SOURCE_SHA"
          fi
          python3 -B .private/hosted_claim.py
  wallet:
    needs: [provision-tor, reserve, prepare-direct]
    if: >-
      ${{ !cancelled() && github.repository == 'Codely-Solutions/zec-private' && github.ref == 'refs/heads/main'
      && github.run_attempt == 1 && (needs.reserve.result == 'success'
      || ((inputs.upgrade_probe == 'restore' || inputs.upgrade_probe == 'transport') && github.event_name == 'workflow_dispatch')
      || (inputs.reuse_funded && !inputs.use_tor && inputs.source_sha != ''
      && (needs.prepare-direct.result == 'success'
      || (inputs.prepared_id != '' && inputs.original_run != '' && inputs.original_controller != '')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 44
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      receipt_id: ${{ steps.receipt.outputs.artifact-id }}
      upgrade_receipt_id: ${{ steps.upgrade-receipt.outputs.artifact-id }}
    env:
      ZEC_CORE_SOURCE: ${{ inputs.source_sha || github.sha }}
      ZEC_CORE_VERSION: ${{ needs.reserve.outputs.version }}
      ZEC_CORE_RESERVATION: ${{ needs.reserve.outputs.reservation }}
      ZEC_CORE_REHEARSAL: ${{ inputs.source_sha == '' }}
      ZEC_CORE_UPGRADE_PROBE: ${{ inputs.upgrade_probe != 'funded' && inputs.upgrade_probe || '' }}
      ZEC_CORE_ARTIFACT_RUN: ${{ inputs.original_run }}
      ZEC_CORE_PREVIOUS_RESERVATION: ${{ inputs.previous_reservation }}
      ZEC_CORE_USE_TOR: ${{ inputs.source_sha == '' || inputs.use_tor }}
      ZEC_CORE_REUSE_FUNDED: ${{ inputs.reuse_funded || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify one-use reservation
        if: '!env.ZEC_CORE_UPGRADE_PROBE && !inputs.reuse_funded'
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=.private python3 -B -c 'from hosted_core import verify_reservation; verify_reservation()'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: '!env.ZEC_CORE_UPGRADE_PROBE && !inputs.reuse_funded'
        with:
          artifact-ids: ${{ needs.provision-tor.outputs.bundle_id }}
          path: ${{ runner.temp }}/zec-tor-runtime
          digest-mismatch: error
      - name: Verify and run the staged Tor binary without a download
        if: '!env.ZEC_CORE_UPGRADE_PROBE && !inputs.reuse_funded'
        run: bash .private/run_tor_ci.sh --install-bundle
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63
        with:
          version: '1.3.6'
      - name: Retrieve exact private upgrade pair
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: bash .private/pull_hosted_fixture.sh "$RUNNER_TEMP/zec-hosted-pair"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        if: inputs.source_sha == ''
        with:
          cache-read-only: true
      - name: Compile testnet-only rehearsal pair
        if: inputs.source_sha == ''
        timeout-minutes: 16
        run: |
          if [[ -n "$ZEC_CORE_UPGRADE_PROBE" ]]; then
            ZEC_CORE_VERSION=$(jq -er '.version_code + 1' .private/hosted-fixture.json)
            echo "ZEC_CORE_VERSION=$ZEC_CORE_VERSION" >> "$GITHUB_ENV"
          fi
          bash .private/build_core_pair.sh "-PZCASH_VERSION_CODE=$ZEC_CORE_VERSION"
      - name: Fetch bound testnet pair
        if: inputs.source_sha != '' && !inputs.reuse_funded
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_ID: ${{ needs.prepare-direct.outputs.artifact_id || inputs.artifact_id }}
          PRODUCTION_ID: ${{ inputs.production_id }}
          ORIGINAL_CONTROLLER: ${{ inputs.original_controller }}
        run: |
          PYTHONPATH=.private python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          from hosted_release import artifact, stage
          from release_metadata import Metadata
          path = Path('core-artifact')
          run = os.environ['ZEC_CORE_ARTIFACT_RUN'] or os.environ['GITHUB_RUN_ID']
          controller = os.environ['ORIGINAL_CONTROLLER'] or os.environ['GITHUB_SHA']
          if os.environ['ZEC_CORE_USE_TOR'] == 'true':
              stage(path, os.environ['CORE_ID'], 'core-testnet-candidate', run=run, controller=controller)
          else:
              stage(path, os.environ['CORE_ID'], 'core-direct-candidate')
          product = artifact(Metadata(), os.environ['PRODUCTION_ID'], 'validated-unsigned-apk',
                             run, controller)
          (path/'production.json').write_text(json.dumps(product))
          PY
      - name: Fetch exact original app and direct test harness
        if: inputs.reuse_funded
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_ID: ${{ inputs.prepared_id || needs.prepare-direct.outputs.artifact_id }}
          ORIGINAL_CORE_ID: ${{ inputs.artifact_id }}
          PRODUCTION_ID: ${{ inputs.production_id }}
          ORIGINAL_RUN: ${{ inputs.original_run || github.run_id }}
          ORIGINAL_CONTROLLER: ${{ inputs.original_controller || github.sha }}
          HARNESS_RUN: ${{ inputs.prepared_id != '' && inputs.original_run || github.run_id }}
          HARNESS_CONTROLLER: ${{ inputs.prepared_id != '' && inputs.original_controller || github.sha }}
        run: |
          PYTHONPATH=.private python3 -B - <<'PY'
          import os
          from pathlib import Path
          from hosted_core import stage_upgrade

          stage_upgrade(Path('core-artifact'), source=os.environ['ZEC_CORE_SOURCE'],
                        core_id=os.environ['CORE_ID'], original_core_id=os.environ['ORIGINAL_CORE_ID'],
                        production_id=os.environ['PRODUCTION_ID'], original_run=os.environ['ORIGINAL_RUN'],
                        original_controller=os.environ['ORIGINAL_CONTROLLER'],
                        producer_run=os.environ['HARNESS_RUN'], producer_controller=os.environ['HARNESS_CONTROLLER'])
          PY
      - name: Run isolated testnet acceptance
        env:
          ZEC_CORE_RESULT: ${{ runner.temp }}/${{ inputs.reuse_funded && 'hosted-upgrade.json' || 'hosted-core.json' }}
        run: |
          git cat-file -e "$ZEC_CORE_SOURCE^{commit}" 2>/dev/null || git fetch --no-tags origin "$ZEC_CORE_SOURCE"
          if [[ ! -x "$ANDROID_HOME/build-tools/36.0.0/zipalign" ]]; then
            timeout 180 "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.0.0'
          fi
          ZEC_HOSTED_CORE_DIR="$PWD/core-artifact" ZEC_HOSTED_FIXTURE_DIR="$RUNNER_TEMP/zec-hosted-pair" bash .private/hosted_emulator_smoke.sh
      - id: receipt
        if: '!env.ZEC_CORE_UPGRADE_PROBE && !inputs.reuse_funded'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hosted-core-receipt
          path: ${{ runner.temp }}/hosted-core.json
          if-no-files-found: error
          retention-days: 3
      - id: upgrade-receipt
        if: inputs.reuse_funded
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hosted-upgrade-receipt
          path: ${{ runner.temp }}/hosted-upgrade.json
          if-no-files-found: error
          retention-days: 3
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/zec-hosted-pair" "$RUNNER_TEMP/zec-tor-runtime" core-artifact original-core-artifact

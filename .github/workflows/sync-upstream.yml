name: Follow stable upstream releases
on:
  schedule:
    - cron: '37 */3 * * *'
  push:
    branches: [main]
    paths: ['.private/security-maintenance.json', '.private/security-maintenance.patch']
  workflow_dispatch:
permissions: {}
jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      main: ${{ steps.ref.outputs.main }}
    steps:
      - id: ref
        shell: python
        run: |
          import os

          if os.environ["GITHUB_REF"] == "refs/heads/main":
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("main=true\n")
  discover:
    needs: admit
    if: needs.admit.outputs.main == 'true'
    concurrency:
      group: zec-private-sync
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/sync-upstream-main.yml
    secrets:
      NTFY_URL: ${{ secrets.NTFY_URL }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      MAINTENANCE_APP_PRIVATE_KEY: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}

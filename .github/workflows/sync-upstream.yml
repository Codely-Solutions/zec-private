name: Follow stable upstream releases
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: zec-private-sync
  cancel-in-progress: false
jobs:
  maintenance:
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
      pull-requests: read
    uses: ./.github/workflows/maintenance-watch.yml
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      source_sha: ${{ steps.sync.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare exact stable release with trusted patch set
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 .private/sync.py
      - name: Report a prepared candidate waiting for signing setup
        if: steps.sync.outputs.changed == 'true' && vars.PRODUCTION_SIGNING_READY != 'true'
        run: echo '::warning::Upstream candidate prepared. Publication is waiting for verified signing environment setup.'
  build:
    needs: [prepare, maintenance]
    if: ${{ always() && !cancelled() && needs.maintenance.result == 'success' && (needs.maintenance.outputs.reconciliation_run != '' || (needs.prepare.result == 'success' && (needs.prepare.outputs.source_sha != '' || needs.maintenance.outputs.source_sha != '') && vars.PRODUCTION_SIGNING_READY == 'true')) }}
    permissions:
      contents: write
      issues: write
      actions: read
      packages: read
    uses: ./.github/workflows/build-release.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha || needs.maintenance.outputs.source_sha }}
      reconciliation_run: ${{ needs.maintenance.outputs.reconciliation_run }}
      hosted: ${{ needs.maintenance.outputs.reconciliation_run == '' }}
    secrets:
      NTFY_URL: ${{ secrets.NTFY_URL }}
  blocked:
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.prepare.result == 'failure' }}
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          MAKE_ISSUE: 'true'
        run: |
          python3 .private/notify.py "ZEC Private update blocked: upstream patch or security review required. Last working release remains available."

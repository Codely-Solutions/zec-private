name: Verify public release independently
on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      attestation_id:
        required: true
        type: string
      attestation_digest:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: inputs.attestation_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.attestation_id }}
          path: ${{ runner.temp }}/publication
      - name: Download and verify the public APK and latest-release response
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RELEASE_TAG: ${{ inputs.release_tag }}
          ATTESTATION_DIGEST: ${{ inputs.attestation_digest }}
        run: python3 -B .private/verify_public_release.py | tee -a "$GITHUB_STEP_SUMMARY"

name: Submit resolved Gradle dependencies
on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle.kts'
      - '**/*.gradle'
      - '**/gradle.lockfile'
      - '**/buildscript-gradle.lockfile'
      - buildSrc/**
      - gradle/**
      - gradle.properties
      - gradlew
      - gradlew.bat
  workflow_dispatch:
permissions: {}
jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      main: ${{ steps.ref.outputs.main }}
    steps:
      - id: ref
        shell: python
        run: |
          import os

          if os.environ["GITHUB_REF"] == "refs/heads/main":
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("main=true\n")
  run_main:
    needs: admit
    if: needs.admit.outputs.main == 'true'
    concurrency:
      group: dependency-graph-main
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/dependency-graph-main.yml

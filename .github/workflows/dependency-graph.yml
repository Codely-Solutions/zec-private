name: Submit resolved Gradle dependencies
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: dependency-graph-main
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          dependency-graph: generate-and-upload
          artifact-retention-days: 1
          cache-read-only: true
          additional-arguments: --no-daemon --no-watch-fs --no-configuration-cache --max-workers=2
  submit:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      actions: read
      contents: write
    steps:
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          dependency-graph: download-and-submit
          cache-disabled: true

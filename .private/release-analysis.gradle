// Procedural instrumentation and synthetic screen fixtures are opt-in debug tools.
// Their APK/host inputs are bound and executed separately; none ships in production.
// Keep production Detekt rules and its existing baseline unchanged.
allprojects {
    tasks.matching { it.name == 'detektAll' }.configureEach {
        exclude('**/.private/core-wallet/**')
        exclude('**/.private/style-comparison/**')
    }
}

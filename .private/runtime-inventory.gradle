import groovy.json.JsonOutput

gradle.projectsEvaluated {
    def app = rootProject.findProject(':app')
    if (app == null) return
    app.tasks.register('privateRuntimeInventory') {
        doLast {
            def name = 'zcashmainnetFossReleaseRuntimeClasspath'
            def configuration = app.configurations.getByName(name)
            def unresolved = configuration.incoming.resolutionResult.allDependencies.findAll {
                it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
            }
            if (!unresolved.isEmpty()) throw new GradleException('Release graph contains unresolved dependencies: ' + unresolved)
            def components = configuration.incoming.resolutionResult.allComponents.collect {
                it.id.displayName
            }.sort()
            def destination = System.getenv('PRIVATE_RUNTIME_OUTPUT') ?: 'artifact/runtime.json'
            def output = new File(destination)
            if (!output.isAbsolute()) output = new File(rootProject.projectDir, destination)
            output.parentFile.mkdirs()
            def sha = ['git', 'rev-parse', 'HEAD'].execute(null, rootProject.projectDir).text.trim()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([source_sha: sha, configuration: name, components: components])) + '\n'
        }
    }
}

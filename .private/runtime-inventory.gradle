import groovy.json.JsonOutput

def writeInventory = { owner, name, output ->
    def configuration = owner.configurations.getByName(name)
    def result = configuration.incoming.resolutionResult
    // The resolution owner is not a dependency. Display names changed in Gradle 9,
    // so compare identifiers and keep project dependency names canonical for policy checks.
    def rootId = result.rootComponent.get().id
    def unresolved = result.allDependencies.findAll {
        it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
    }
    if (!unresolved.isEmpty()) throw new GradleException('Unresolved runtime dependencies: ' + unresolved)
    def sha = ['git', 'rev-parse', 'HEAD'].execute(null, owner.rootProject.projectDir).text.trim()
    output.parentFile.mkdirs()
    output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
        source_sha: sha, configuration: name,
        components: result.allComponents.findAll { it.id != rootId }.collect {
            it.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier
                ? 'project ' + it.id.projectPath : it.id.displayName
        }.sort()
    ])) + '\n'
}

gradle.projectsEvaluated {
    def app = rootProject.findProject(':app')
    if (app == null) return
    def destination = System.getenv('PRIVATE_RUNTIME_OUTPUT') ?: 'artifact/runtime.json'
    def output = new File(destination)
    if (!output.isAbsolute()) output = new File(rootProject.projectDir, destination)
    def foundation = rootProject.project(':wallet-foundation-lib')
    def sharedTask = foundation.tasks.register('privateRuntimeInventory') {
        doLast {
            writeInventory(foundation, 'runtimeClasspath', new File(output.parentFile, 'foundation-runtime.json'))
        }
    }
    app.tasks.register('privateRuntimeInventory') {
        dependsOn(sharedTask)
        doLast {
            writeInventory(app, 'zcashmainnetFossReleaseRuntimeClasspath', output)
        }
    }
}

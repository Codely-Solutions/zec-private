// Test-only source and existing dependencies; no production variant is modified.
allprojects { app ->
    app.plugins.withId('com.android.application') {
        if (app.path == ':app') {
            app.android.sourceSets.getByName('androidTest').kotlin.directories.add(new File(app.rootProject.projectDir, '.private/core-wallet/src').path)
            app.dependencies.add('androidTestImplementation', app.dependencies.project(path: ':ui-lib'))
            app.dependencies.add('androidTestImplementation', app.dependencies.project(path: ':sdk-ext-lib'))
            def libs=app.extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('libs')
            app.dependencies.add('androidTestImplementation',libs.findLibrary('zcash-sdk-backend').get())
            app.dependencies.add('androidTestImplementation','com.google.protobuf:protobuf-javalite:4.34.0')
        }
    }
}

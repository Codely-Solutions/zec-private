// Debug-only host uses the production theme and components without style overlays.
allprojects { p ->
    p.plugins.withId('com.android.library') {
        if (p.path == ':ui-lib') {
            p.android.sourceSets.debug.kotlin.directories.add(new File(p.rootProject.projectDir, '.private/style-comparison/src').path)
            p.android.sourceSets.debug.manifest.srcFile(new File(p.rootProject.projectDir, '.private/style-comparison/AndroidManifest.xml'))
            p.android.sourceSets.maybeCreate('testDebug').kotlin.directories.add(
                new File(p.rootProject.projectDir, '.private/style-comparison/test').path
            )
        }
        if (p.path in [':ui-lib', ':feature-viewing-key']) {
            def captureDirectory = p.findProperty('privateReviewCaptureDir')
            if (captureDirectory != null) {
                p.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                    systemProperty 'private.review.captureDir', captureDirectory.toString()
                }
            }
        }
    }
}

// Explicit, guarded metadata bootstrap only. Normal builds must omit this init script.
def guardValue = System.getenv('CODEX_GUARD_OUTPUT')
if (!guardValue) throw new GradleException('Dependency bootstrap requires CODEX_GUARD_OUTPUT')
def guardRoot = new File(guardValue).canonicalFile
if (gradle.parent != null) return
def checkout = new File(guardRoot, 'src').canonicalFile
if (gradle.startParameter.currentDir.canonicalFile != checkout || !new File(checkout, '.git').exists()) {
    throw new GradleException('Dependency bootstrap requires the guarded checkout')
}

def exportName = gradle.startParameter.projectProperties.get('verificationExport') ?: 'verification-bootstrap'
if (!(exportName ==~ /[a-z0-9-]+/)) throw new GradleException('Invalid verification export name')
def exportDirectory = new File(guardRoot, exportName)
if (exportDirectory.exists()) throw new GradleException('Verification export must be new')
def metadata = new File(checkout, 'gradle/verification-metadata.xml')
def originalBytes = metadata.exists() ? metadata.bytes : null

gradle.startParameter.writeDependencyVerifications = ['sha256']

// This one-shot init script needs end-of-build export and restoration; it is not configuration-cache compatible.
gradle.buildFinished {
    try {
        if (!metadata.isFile()) throw new GradleException('Gradle did not generate verification metadata')
        if (!exportDirectory.mkdir()) throw new GradleException('Could not create verification export directory')
        new File(exportDirectory, 'verification-metadata.xml').bytes = metadata.bytes
    } finally {
        if (originalBytes != null) {
            metadata.bytes = originalBytes
        } else if (metadata.exists() && !metadata.delete()) {
            throw new GradleException('Could not retire generated verification metadata')
        }
    }
}
